# DREAM-OS environment configuration (Stage 0, verified 2026-10-27).
benchmark:
  primary: FetchPush-v4     # gymnasium-robotics: object pushing, goal-conditioned, is_success flag
  secondary: Pusher-v5      # gymnasium MuJoCo: zero-extra-dependency pipeline smoke test
  # NOTE: the id is FetchPush-v4 (gymnasium-robotics 1.4.2), not v3.

simulator:
  engine: mujoco
  version: "3.3.6"          # pinned; see requirements.txt for why

device: cuda                # verified torch.cuda.is_available() == True on RTX 4050 Laptop (6 GB)
device_fallback: cpu

seeds:
  reset: 0
  action: 123

# Observed state shapes (from Stage 0 smoke, for downstream world-model wiring):
state_shapes:
  Pusher-v5:    { obs_dim: 23, qpos_dim: 11 }
  FetchPush-v4: { obs_dim: 25, qpos_dim: 22, goal_conditioned: true }
